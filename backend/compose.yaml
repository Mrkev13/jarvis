# MRK-101: Standa Hub backend on the Ubuntu host (docs/ubuntu-deployment.md). Secrets only in backend/.env.production.
services:
  migrate:
    image: standa-hub-backend:local
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    env_file:
      - path: .env.production
        format: raw
    networks:
      - postgres_net

  backend:
    depends_on:
      migrate:
        condition: service_completed_successfully
    build:
      context: .
    image: standa-hub-backend:local
    container_name: standa-hub-backend
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    env_file:
      - path:  .env.production
        format: raw
    environment:
      # set by the deploy (MRK-108) so /health reports the running commit; empty = unknown
      APP_COMMIT: ${APP_COMMIT:-}
    command:
      - python
      - -m
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-proxy-headers
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - /srv/standa-hub-data/media:/data/media
      - /srv/standa-hub-data/backups:/data/backups
    networks:
      - postgres_net
      - jarvis_api

networks:
  postgres_net:
    external: true
    name: postgres_default
  jarvis_api:
    external: true
    name: jarvis_api
