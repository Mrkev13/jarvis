name: Review gate

# MRK-97: a PR may merge only after a reviewer verdict for its exact head commit.
# The reviewer (Codex, never the agent that wrote the code - AGENTS.md workflow) ends its review with one line
#   Codex-Verdict: MERGE      or      Codex-Verdict: BLOCK
#
# TRUSTED: this workflow always runs the copy on the default branch, never a PR's copy:
# - pull_request_target runs the base branch's file; workflow_dispatch runs the file of --ref main.
# - It never checks out or runs PR code; it only reads the PR through the API.
# Because pull_request_target check runs land on the base commit, the result is a commit STATUS on the PR head:
#   context "Review gate (Codex verdict)" - this is the required check in branch protection (docs/operations.md).
# Triggers: every push / label change (pull_request_target) and, after each posted review, codex-review.sh runs
#   gh workflow run review-gate.yml --ref main -f pr=<n>      (a review by hand: "Run workflow" in Actions)
#
# On MERGE: normal PR -> GitHub auto-merge; critical change (migrations, auth, backups, CI/review/deploy) -> label
# `manual-merge`, no auto-merge, Standa merges by hand. Label `manual-merge` set by hand = no auto-merge either.
# Limitations (docs/operations.md): author and reviewer post with the same GitHub account (the verdict line is a
# rule, not an identity check), and a PR that ADDS a new workflow runs it with that PR's token - such a PR is
# critical (.github/) and the reviewer must block anything that touches this gate.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  contents: read

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

jobs:
  gate:
    name: Review gate (Codex verdict)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write        # gh pr merge --auto
      pull-requests: write   # label manual-merge, read reviews and files
      statuses: write        # the required status on the PR head
    steps:
      - uses: actions/github-script@v7
        env:
          PR_INPUT: ${{ github.event.inputs.pr }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const CONTEXT = 'Review gate (Codex verdict)';
            // A dispatch could name another ref (= another copy of this file): only the default branch is trusted.
            const trusted = `refs/heads/${context.payload.repository.default_branch}`;
            if (context.eventName === 'workflow_dispatch' && context.ref !== trusted) {
              core.setFailed(`Run the review gate from ${trusted} only.`);
              return;
            }
            const input = String(process.env.PR_INPUT || '');
            const number = context.payload.pull_request ? context.payload.pull_request.number : (/^[0-9]{1,7}$/.test(input) ? Number(input) : 0);
            if (!Number.isInteger(number) || number <= 0) { core.setFailed('No valid PR number.'); return; }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const head = pr.head.sha;
            const short = head.slice(0, 7);
            const status = (state, description) => github.rest.repos.createCommitStatus(
              { owner, repo, sha: head, state, context: CONTEXT, description: description.slice(0, 140) });
            if (pr.state !== 'open') { core.notice(`PR #${number} is ${pr.state}.`); return; }

            // Critical areas need Standa's manual merge (AGENTS.md workflow, docs/operations.md "Critical changes").
            const CRITICAL = [
              ['migrace', /^backend\/alembic\//],
              ['přihlašování a bezpečnost', /^backend\/auth[^/]*\.py$|^frontend\/proxy\.ts$/],
              ['zálohy a obnova', /^backend\/(backup_service|offsite_backup|offsite_restic)\.py$|^scripts\/.*(backup|restore|offsite)/i],
              ['CI, review a deploy', /^\.github\/|^scripts\/|(^|\/)Dockerfile[^/]*$|(^|\/)(docker-)?compose[^/]*\.ya?ml$/],
            ];
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
            const paths = files.flatMap((f) => [f.filename, f.previous_filename].filter(Boolean));
            const critical = CRITICAL.filter(([, re]) => paths.some((p) => re.test(p))).map(([label]) => label);

            // Only the repository owner's account (Codex CLI posts as the owner), only reviews on this commit,
            // never dismissed ones; the newest verdict wins.
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number, per_page: 100 });
            const verdicts = reviews
              .filter((r) => r.commit_id === head && r.user && r.user.login === owner && r.state !== 'DISMISSED')
              .map((r) => ({ at: r.submitted_at || '', m: /^Codex-Verdict:\s*(MERGE|BLOCK)\s*$/m.exec(r.body || '') }))
              .filter((x) => x.m)
              .sort((a, b) => a.at.localeCompare(b.at));
            const last = verdicts[verdicts.length - 1];
            if (!last) {
              await status('pending', `Waiting for a Codex review with "Codex-Verdict: MERGE" on ${short}.`);
              core.notice(`PR #${number}: no verdict on ${short} yet.`);
              return;
            }
            if (last.m[1] !== 'MERGE') {
              await status('failure', `Codex verdict on ${short}: BLOCK. Fix the findings and push.`);
              core.notice(`PR #${number}: BLOCK on ${short}.`);
              return;
            }
            await status('success', `Codex verdict on ${short}: MERGE.` + (critical.length ? ' Critical change: manual merge.' : ''));
            if (pr.draft) return;
            const labels = pr.labels.map((l) => l.name);
            if (critical.length) {
              if (!labels.includes('manual-merge')) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: ['manual-merge'] });
              }
              core.notice(`Critical change (${critical.join(', ')}): approved by Codex, waiting for Standa's manual merge.`);
              return;
            }
            if (labels.includes('manual-merge')) { core.notice('Label manual-merge: merge by hand.'); return; }
            try {
              await github.graphql(
                'mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: MERGE}) { clientMutationId } }',
                { id: pr.node_id });
              core.notice(`PR #${number}: auto-merge enabled.`);
            } catch (e) {
              core.warning(`Auto-merge not enabled (repo setting "Allow auto-merge" or branch protection missing?): ${e.message}`);
            }
