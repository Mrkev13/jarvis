name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and pyflakes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: 'sqlite+pysqlite:///:memory:'
      # Only constructs the client. pytest-socket forbids TCP sockets, while
      # the dead loopback URL also protects child-process initialization.
      GROQ_API_KEY: ci-placeholder-not-a-secret
      GROQ_BASE_URL: http://127.0.0.1:9
      SCHEDULER_ENABLED: 'false'
      REMINDERS_CHECK_ENABLED: 'false'
      DAILY_BRIEFING_ENABLED: 'false'
      WEEKLY_REVIEW_ENABLED: 'false'
      EXTERNAL_DELIVERY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check app code
        run: python -m pyflakes backend/*.py backend/scripts/*.py backend/modules/*.py backend/modules/*/*.py
      - name: Run tests without network access
        run: python -m pytest backend/tests --disable-socket --allow-unix-socket -x -q

  migrations:
    name: PostgreSQL migration round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg2://ci:ci-test-only@localhost:5432/standa_hub_test
      TEST_POSTGRES_URL: postgresql+psycopg2://ci:ci-test-only@localhost:5432/standa_hub_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: standa_hub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d standa_hub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend and test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Upgrade to head
        run: python -m alembic upgrade head
      - name: Downgrade one revision
        run: python -m alembic downgrade -1
      - name: Upgrade back to head
        run: python -m alembic upgrade head
      - name: Check PostgreSQL schema matches models
        run: python -m pytest tests/test_migration_postgres.py -x -q

  frontend:
    name: Frontend lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  # MRK-95: browser UI checks (mock API from fixtures, never Groq, no network beyond localhost).
  # Screenshots (desktop + 390 px) are uploaded as the "ui-check-screenshots" artifact for the PR review.
  ui:
    name: UI checks (ui-check, module flags, changes)
    # Playwright 1.56 installs Chromium only on the Ubuntu releases it supports (not yet on 26.04 = ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Playwright is not an app dependency; the checks import it by name (see ui-check.mjs header).
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run UI checks
        run: bash scripts/ui-check-run.sh
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-check-screenshots
          path: frontend/scripts/.ui-check/
          include-hidden-files: true  # .ui-check is a dot directory; without this nothing is uploaded
          retention-days: 14
          if-no-files-found: warn
