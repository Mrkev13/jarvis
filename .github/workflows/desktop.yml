name: Desktop agent

# MRK-156: Jarvis pro PC (desktop/). Jádro se testuje na Linuxu, aplikace se staví na Windows
# a instalátor (NSIS, .exe) se nahraje jako artefakt `jarvis-pro-pc-windows`.
on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Agent core tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: core-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (agent-core)
        run: cargo clippy -p agent-core --all-targets --locked -- -D warnings
      - name: Tests (agent-core)
        run: cargo test -p agent-core --locked

  windows:
    name: Windows build and installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: win-${{ runner.os }}-${{ hashFiles('desktop/Cargo.lock') }}
      - name: Tests (workspace)
        run: cargo test --workspace --locked
      - name: Clippy (app)
        run: cargo clippy -p jarvis-agent --locked -- -D warnings
      - name: Install Tauri CLI
        run: npm ci
      - name: Build installer
        run: npm run build -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-pro-pc-windows
          path: desktop/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
