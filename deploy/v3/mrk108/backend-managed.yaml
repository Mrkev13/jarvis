services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE required}
    container_name: standa-hub-backend
    restart: unless-stopped

    env_file:
      - path: ${BACKEND_ENV_FILE:?BACKEND_ENV_FILE required}
        format: raw

    environment:
      APP_COMMIT: ${APP_COMMIT:?APP_COMMIT required}

    command:
      - python
      - -m
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --no-proxy-headers

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - /srv/standa-hub-data/media:/data/media
      - /srv/standa-hub-data/backups:/data/backups

    networks:
      - postgres_net
      - jarvis_api

networks:
  postgres_net:
    external: true
    name: postgres_default

  jarvis_api:
    external: true
    name: jarvis_api
