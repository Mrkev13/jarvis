services:
  frontend:
    image: standa-hub-frontend:local
    container_name: standa-hub-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://<tailnet-host>:8443
      NODE_ENV: production
      INTERNAL_API_URL: http://standa-hub-backend:8000
    ports:
      - "127.0.0.1:3000:3000"

    networks:
      - default
      - jarvis_api

networks:
  jarvis_api:
    external: true
    name: jarvis_api
