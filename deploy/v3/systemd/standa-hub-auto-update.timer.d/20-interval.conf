# MRK-108 (decision 2026-11-15): poll the production branch every 10 minutes instead of hourly.
# Install: /etc/systemd/system/standa-hub-auto-update.timer.d/20-interval.conf (root, 644), then
#   systemctl daemon-reload && systemctl restart standa-hub-auto-update.timer
# Delivery time = up to 10 min wait + push CI on the production SHA + image build; not a guaranteed 15-minute SLA.
[Timer]
OnUnitInactiveSec=
OnUnitInactiveSec=10min
